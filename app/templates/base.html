<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}VocabGuesser{% endblock %}</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 { margin-bottom: 0.25rem; }
      .muted { color: #666; font-size: 0.9rem; }
      .pack-list { list-style: none; padding: 0; }
      .pack-list li {
        padding: 0.75rem 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .badge {
        background: #fde68a;
        color: #92400e;
        font-size: 0.75rem;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 2rem;
        text-align: center;
        margin: 1.5rem 0;
      }
      .card .word { font-size: 2rem; font-weight: 600; }
      .card .definition { font-size: 1.25rem; }
      .card .lang-tag {
        display: inline-block;
        font-size: 0.75rem;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
      button, .btn {
        padding: 0.5rem 1rem;
        border: 1px solid #999;
        background: #f5f5f5;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        transition: box-shadow 90ms ease, transform 90ms ease, background 90ms ease;
      }
      button:hover, .btn:hover {
        background: #ececec;
        box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      }
      button:active, .btn:active {
        background: #e0e0e0;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
        transform: translateY(1px);
      }
      button:focus-visible, .btn:focus-visible {
        outline: 2px solid #888;
        outline-offset: 2px;
      }
      button.primary { background: #2563eb; color: white; border-color: #1d4ed8; }
      button.primary:hover  { background: #1d4ed8; }
      button.primary:active { background: #1e40af; }
      form.inline { display: inline; margin: 0; }
      .prefs {
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
        align-items: center;
        padding: 0.75rem 1rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 1rem;
        background: #fafafa;
      }
      .prefs label { display: flex; flex-direction: column; gap: 0.25rem; }
      .prefs label.check {
        flex-direction: row;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1rem;
      }
      .prefs select { font: inherit; padding: 0.25rem; }
      .words-table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 0.5rem;
      }
      .words-table th, .words-table td {
        text-align: left;
        vertical-align: top;
        padding: 0.5rem;
        border-bottom: 1px solid #eee;
      }
      .words-table th {
        background: #f7f7f7;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .defs { margin: 0; padding-left: 1.25rem; }
      .defs li { margin: 0.15rem 0; }
      .defs em { color: #555; font-style: italic; margin-right: 0.25rem; }
      .status-btn.known   { background: #dcfce7; border-color: #86efac; }
      .status-btn.unknown { background: #fef3c7; border-color: #fcd34d; }
      .btn.page-current { background: #2563eb; color: white; border-color: #1d4ed8; pointer-events: none; }
      .flash {
        padding: 0.5rem 0.75rem;
        background: #ecfeff;
        border: 1px solid #a5f3fc;
        border-radius: 6px;
        margin: 0.75rem 0;
      }
      /* --- Task UI --- */
      .task-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
      .gap-text { font-size: 1.15rem; line-height: 1.6; white-space: pre-wrap; }
      .task-ui { margin: 0.5rem 0 0.75rem; }
      .task-choice { font-size: 0.95rem; }
      .which-def-options { display: flex; flex-direction: column; gap: 0.4rem; text-align: left; }
      .def-option {
        text-align: left; padding: 0.5rem 0.75rem; font-size: 0.9rem;
        border: 1px solid #ccc; border-radius: 6px; background: #f9f9f9;
        cursor: pointer; transition: background 90ms;
      }
      .def-option:hover { background: #ececec; }
      .def-option:disabled { opacity: 0.5; cursor: default; }
      .skip-btn { color: #999; border-color: #ddd; background: #fafafa; font-size: 0.85rem; }
      .result-toast {
        display: none; padding: 0.6rem 1rem; border-radius: 8px;
        background: #fefce8; border: 1px solid #fbbf24;
        font-weight: 500; margin: 0.5rem 0; text-align: center;
      }
      .result-toast.result-correct { background: #f0fdf4; border-color: #86efac; }
      .result-toast.result-wrong   { background: #fff1f2; border-color: #fca5a5; }
      /* --- Card flip --- */
      .card-scene { perspective: 1000px; margin: 1.5rem 0; }
      .card-flipper {
        display: grid;
        transform-style: preserve-3d;
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-flipper.flipped { transform: rotateY(180deg); }
      .card-face {
        grid-area: 1 / 1;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 2rem;
        background: white;
        box-sizing: border-box;
        min-height: 150px;
        text-align: center;
      }
      .card-back { transform: rotateY(180deg); text-align: left; }
      /* --- Inline toast --- */
      .word-toast {
        display: none;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding: 0.5rem 0.75rem;
        background: #fffbeb;
        border: 1px solid #fcd34d;
        border-radius: 8px;
        margin: 0.5rem 0;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <nav style="font-size:0.85rem;margin-bottom:0.5rem;color:#888;">
      <a href="/">Packs</a> · <a href="/words">Dictionary</a> · <a href="/corpus">Corpus</a> · <a href="/grammar">Grammar</a>
    </nav>
    {% block content %}{% endblock %}
  </body>
</html>
